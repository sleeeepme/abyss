<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>石の層 — 壁とレイヤー</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1420;color:#d8e5df;font:14px/1.65 system-ui}main{max-width:1160px;margin:auto;padding:24px}h1{font-size:25px;margin:0}p{color:#99b3b0}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,a{font:inherit;background:#253b43;color:#d7eee2;border:1px solid #47616b;border-radius:5px;padding:8px 12px;cursor:pointer}label{background:#192730;padding:7px 10px}canvas,img{image-rendering:pixelated}#view{width:1024px;max-width:100%;height:auto;display:block;border:1px solid #293643;touch-action:none}#sheet{width:768px;max-width:100%;background:repeating-conic-gradient(#1b2731 0 25%,#283440 0 50%) 0/24px 24px}#status{color:#d5c597;min-height:25px}summary{cursor:pointer}section{margin-top:26px}h2{font-size:18px}.note{font-size:12px;color:#8fa4a5}#pad{display:flex;gap:6px}#pad button{width:52px;height:42px;touch-action:none}@media(max-width:600px){main{padding:12px}h1{font-size:21px}}</style><main><h1>石の層 — 岩壁で囲まれた洞窟</h1><p>床は4枚。壁面・上端・角・苔・植物は別レイヤーで組み立て。</p><nav><label><input id="walls" type="checkbox" checked>壁</label><label><input id="moss" type="checkbox" checked>苔</label><label><input id="props" type="checkbox" checked>装飾</label><label><input id="glow" type="checkbox" checked>局所光</label><label><input id="grid" type="checkbox">通行マス</label><button id="occlude">壁の裏に立つ</button><button id="exit">出口まで歩く</button><button id="home">入口へ</button></nav><canvas id="view" width="512" height="432"></canvas><nav id="pad"><button data-key="ArrowLeft">←</button><button data-key="ArrowUp">↑</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button></nav><div id="status">床をタップして移動／矢印・WASDで歩行。</div><p class="note">青白い人物は検証用マーカー。手前の壁の裏では隠れます。壁・黒い領域は進入不可。階段は同じマップ内の装飾で、階層移動は未実装。</p><section><h2>タイルセット — 28パーツ</h2><img id="sheet" src="assets/stone-rd-v3/atlas.png">
