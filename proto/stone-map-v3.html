<main><header><h1>石の層 / コンセプトアートをマップへ</h1><small>24pxグリッド · 斜め上からの壁面 · ピクセル等倍描画</small></header>
<nav><select id="map"><option value="0">本編マップ / seed 7</option><option value="1">本編マップ / seed 31</option><option value="2">本編マップ / seed 101</option><option value="3">形状サンプル / 洞窟の広間</option></select><button id="room">広間</button><button id="narrow">2マス通路</button><button id="exit">出口へ歩く</button><button id="portrait">縦画面にする</button><select id="layer"><option value="art">完成表示</option><option value="analysis">床・壁の役割を見る</option><option value="grid">通行グリッドを重ねる</option></select></nav>
<div id="stage"><canvas width="480" height="300" aria-label="床と方向別の壁で構成した洞窟マップ"></canvas></div>
<footer><span><kbd>WASD / 矢印</kbd> で歩行 · 床クリックで移動</span><span id="status"></span></footer>
<p>作成済みのコンセプトをもとに、自然な石板の床、灰色の岩壁、苔のある側面を制作。前稿の歩ける床と壁の構造はそのままに、マップ用の画像素材へ置き換えています。</p>
<p id="legend" hidden>黄土色＝歩ける床 / 青＝奥の壁面 / 緑＝左右の壁面 / 紫＝手前の切断面 / 黒＝壁の内部。色の付いた壁はすべて通行不能領域内です。</p>
