<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>洞窟マップ — リファレンス再構成</title><style>body{background:#211f25;color:#d5cbd9;font:14px/1.6 system-ui;margin:24px}main{max-width:1100px;margin:auto}h1{font-size:21px}section{display:flex;gap:24px;align-items:start;flex-wrap:wrap}canvas{image-rendering:pixelated;background:#302c2c;width:768px;max-width:100%;height:auto}button,a{color:#bce4ec;background:#383040;padding:8px;border:1px solid #66576d;cursor:pointer}nav{margin:16px 0;display:flex;gap:10px}aside{max-width:260px}img{image-rendering:pixelated;width:256px;max-width:100%}#atlas{width:512px}p{color:#ac9fae}</style><main><h1>洞窟マップ — リファレンス再構成</h1><p>上段の水路と滝 → 右の階段 → 下段の石碑。8pxの固定タイルと独立した岩・装飾パーツで組み立て。</p><nav><button id="grid">グリッド</button><button id="props">装飾 ON / OFF</button><button id="height">床の高さ</button><a href="assets/cave-reference-v5/map.json">マップデータ</a></nav><section><canvas id="view" width="256" height="256"></canvas><aside><img src="assets/cave-reference-v5/reference.png"><p>配置・配色の比較用リファレンス</p><div id="info"></div></aside></section><h2>使用タイル / パーツ</h2><p>床・境界272枚、崖4枚、水16枚。岩・階段・滝・石碑などは別シートから配置。</p><img id="atlas" src="assets/cave-reference-v5/tiles.png"><img style="width:480px" src="assets/cave-reference-v5/props.png"></main><script src="assets/cave-reference-v5/map.js"></script><script>
const m=CAVE_MAP,c=document.getElementById('view'),g=c.getContext('2d');g.imageSmoothingEnabled=false;let grid=false,showProps=true,showHeight=false;const t=new Image(),p=new Image();t.src='assets/cave-reference-v5/tiles.png';p.src='assets/cave-reference-v5/props.png';
function draw(){g.fillStyle='#302c2c';g.fillRect(0,0,256,256);for(const [name,layer]of Object.entries(m.layers)){layer.forEach((id,n)=>{if(id<0)return;g.drawImage(t,id%16*8,(id>>4)*8,8,8,n%32*8,(n>>5)*8,8,8)})}if(showProps)m.props.slice().sort((a,b)=>(a.y+a.h)-(b.y+b.h)).forEach(s=>g.drawImage(p,s.id%4*40,(s.id>>2)*40,40,40,s.x,s.y,s.w,s.h));if(showHeight)m.elevation.forEach((v,n)=>{if(v<0)return;g.fillStyle=v?'#42d3df66':'#f4bd7066';g.fillRect(n%32*8,(n>>5)*8,8,8)});if(grid){g.strokeStyle='#e9def03a';g.lineWidth=.25;for(let i=0;i<=256;i+=8){g.beginPath();g.moveTo(i,0);g.lineTo(i,256);g.moveTo(0,i);g.lineTo(256,i);g.stroke()}}}
window.ready=Promise.all([t.decode(),p.decode()]).then(draw);document.getElementById('grid').onclick=()=>{grid=!grid;draw()};document.getElementById('props').onclick=()=>{showProps=!showProps;draw()};document.getElementById('height').onclick=()=>{showHeight=!showHeight;draw()};c.onmousemove=e=>{const r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*32),y=Math.floor((e.clientY-r.top)/r.height*32),n=y*32+x;document.getElementById('info').textContent=`セル ${x},${y} / 床 ${m.layers.ground[n]} / 高さ ${m.elevation[n]}`};
</script></html>
