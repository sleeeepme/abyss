<main><h1>石の層 — タイルセットから組むマップ</h1><p>32×32pxの固定タイルを配置。床・壁・苔・水面はすべて下の同じシートから使っています。</p>
<nav><select id="map"><option value="0">組み立てサンプル</option><option value="1">本編 seed 7</option><option value="2">本編 seed 31</option><option value="3">本編 seed 101</option><option value="4">角・端・分岐の接続試験</option></select><button id="room">広間</button><button id="narrow">細い通路</button><button id="exit">出口へ歩く</button><button id="portrait">縦画面</button><label><input type="checkbox" id="grid">タイルの区切り</label><label><input type="checkbox" id="decor" checked>苔・水面</label></nav>
<div id="stage"><canvas id="mapview" width="640" height="384"></canvas></div><footer><span>WASD / 矢印で歩行 · 床をクリックすると移動</span><span id="status">素材を読み込み中…</span></footer><div id="readout">カーソルを合わせると使用タイル番号を表示します。</div>
<section><details open><summary>タイルシート / 186枚</summary><div class="legend"><span>床 32</span><span>壁 47形状＋12差分</span><span>苔 47</span><span>水面 47</span><span>階段 1</span></div><p>床32枚は8列×4行の組として接続します。壁は周囲8方向から形状を選びます。シート上のタイルをクリックすると、マップ内の使用箇所を表示します。</p><canvas id="atlas" width="512" height="384"></canvas><div id="tileinfo">タイルを選択</div><nav><button id="clear">選択を解除</button><a href="assets/stone-tileset-v4/tiles.png">元サイズPNG</a><a href="assets/stone-tileset-v4/stone.tsj">Tiled用タイルセット</a><a href="../docs/STONE_TILESET_V4.md">構成と検証</a></nav></details><details><summary>装飾パーツ / 12点</summary><img style="width:512px;max-width:100%;image-rendering:pixelated" src="assets/stone-tileset-v4/props.png" alt="岩・石筍・苔・蔦などの装飾パーツ"></details></section></main>
