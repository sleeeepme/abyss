<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABYSS 武器技エフェクト案 V44</title><style>:root{color-scheme:dark;font-family:system-ui;background:#101713;color:#edf1e8}body{max-width:1040px;margin:auto;padding:30px 18px}h1{font-size:25px;font-weight:600}p{color:#b6c3b4;line-height:1.7}.controls{display:flex;gap:12px;align-items:center;margin:20px 0}button{background:#26372d;color:#eef4e9;border:1px solid #526254;padding:8px 14px;border-radius:5px}input{flex:1;accent-color:#dfe8c3}main{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}article{background:#17231c;border:1px solid #3d4d40}h2{font-size:15px;margin:12px 14px 5px}article p{font-size:12px;margin:0 14px 12px}canvas{display:block;width:100%;image-rendering:pixelated}@media(max-width:700px){main{grid-template-columns:1fr}}</style></head><body><p>ABYSS / WEAPON ART EFFECT STUDY V44</p><h1>剣・槍・斧・弓・短剣・戦鎚・杖・大剣技：通常攻撃から発展させる</h1><p>承認済みの各武器の通常攻撃を直接再利用し、倍率・向き・回数・発動前の小さな閃きだけで技にしています。</p><div class="controls"><button id="play">一時停止</button><button id="replay">再生</button><input id="scrub" type="range" min="0" max="1400" value="0"><span id="time">0 ms</span></div><main id="grid"></main><script src="ally-effect-study.js"></script><script src="weapon-art-effect-study.js"></script><script>(()=>{const g=WeaponArtEffectStudy,grid=document.querySelector('#grid'),items=[];g.keys.forEach(k=>{const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),c=document.createElement('canvas');c.width=320;c.height=170;h.textContent=g.defs[k].label;p.textContent=g.defs[k].note;a.append(h,p,c);grid.append(a);items.push([k,c.getContext('2d')]);});let playing=true,start=performance.now(),fixed=0;const slider=document.querySelector('#scrub'),time=document.querySelector('#time');function draw(now){const ms=playing?(now-start)%1400:fixed;slider.value=ms;time.textContent=Math.round(ms)+' ms';items.forEach(([k,c])=>g.scene(c,k,ms/1000));requestAnimationFrame(draw)}document.querySelector('#play').onclick=()=>{playing=!playing;if(playing)start=performance.now()-fixed;document.querySelector('#play').textContent=playing?'一時停止':'再生'};document.querySelector('#replay').onclick=()=>{fixed=0;start=performance.now();playing=true};slider.oninput=()=>{fixed=+slider.value;playing=false};requestAnimationFrame(draw)})();</script></body></html>
