<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>土と苔の床パターン</title><style>*{box-sizing:border-box}body{margin:0;background:#152229;color:#d5dfd6;font:14px/1.7 system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:24px;margin:0}h2{font-size:18px;margin-top:26px}p{color:#a6bab1}nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}button,select,a{font:inherit;padding:9px 12px;background:#2b4145;border:1px solid #5f7872;color:#e0e9d6;cursor:pointer}canvas,img{image-rendering:pixelated}#map{width:1024px;max-width:100%;height:auto;display:block}#sheet{width:768px;max-width:100%;height:auto}figure{margin:0}small{color:#a6b7b2}@media(max-width:500px){main{padding:12px}h1{font-size:21px}}</style><main><h1>土と苔で地面として読める床へ</h1><p>土の色むら・埋まった小石・薄い苔・密な苔。中央には苔の少ない通り道を残しています。</p><nav><select id="mode"><option value="path">苔のある通り道</option><option value="bare">裸の土</option><option value="sparse">薄い苔</option><option value="dense">密な苔</option></select><label><input type="checkbox" id="mask">苔の範囲</label><label><input type="checkbox" id="grid">32px区切り</label></nav><canvas id="map" width="384" height="256"></canvas><p id="caption">左右反転の連続配置をやめ、土と苔を不規則に重ねた384×256pxのループ。下に2×2反復も表示します。</p><h2>2×2に敷いた接続確認</h2><canvas id="repeat" width="768" height="512" style="width:100%;height:auto"></canvas><h2>床の素材パターン / 32×32px・12枚</h2><img id="sheet" src="assets/stone-floor-v2/tiles.png"><p>上段：裸の土4枚／中段：薄い苔4枚／下段：密な苔4枚。</p><nav><a href="assets/stone-floor-v2/tiles.png">タイルPNG</a><a href="assets/stone-floor-v2/tileset.tsj">Tiled用定義</a><a href="assets/stone-floor-v2/pattern.json">配置情報</a></nav><small>壁・建物・照明は使っていません。苔の遷移は、この比較用パターンの別マスクで処理しています。</small></main><script>
const c=document.getElementById('map'),g=c.getContext('2d'),img=new Image();img.src='assets/stone-floor-v2/tiles.png';let pixels;const W=384,H=256;function reflect(n,len){n=((n%(len*2))+len*2)%(len*2);return n<len?n:len*2-1-n}function hash(x,y){let n=Math.imul(x+31,374761393)^Math.imul(y+17,668265263);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295}
function noise(x,y,nx,ny,seed=0){x=((x/W)%1+1)%1*nx;y=((y/H)%1+1)%1*ny;let ix=Math.floor(x),iy=Math.floor(y),u=x-ix,v=y-iy;u=u*u*(3-2*u);v=v*v*(3-2*v);const h=(a,b)=>hash((a+nx)%nx+seed,(b+ny)%ny+seed*3);return (h(ix,iy)*(1-u)+h(ix+1,iy)*u)*(1-v)+(h(ix,iy+1)*(1-u)+h(ix+1,iy+1)*u)*v}
function kind(x,y,mode){if(mode==='bare')return 0;if(mode==='sparse')return 1;if(mode==='dense')return 2;const center=190+Math.sin(y/H*Math.PI*2)*43+Math.cos(y/H*Math.PI*4)*13;let d=Math.abs(x-center)+(noise(x,y,12,8,23)-.5)*48+(noise(x,y,24,16,9)-.5)*12;return d<40?0:d<83?1:2}
const stamps=Array.from({length:220},(_,i)=>({x:Math.floor(hash(i,71)*W),y:Math.floor(hash(i,93)*H),v:Math.floor(hash(i,122)*4),flip:hash(i,19)>.5,seed:i}));
function render(mode,debug=false){const result=new Uint8ClampedArray(W*H*4);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=(y*W+x)*4,k=kind(x,y,mode),q=noise(x,y,12,8,11);const col=q<.27?[38,64,66]:q>.77?[42,68,70]:[40,66,68];for(let ch=0;ch<3;ch++)result[i+ch]=debug?[[110,92,74],[90,135,91],[31,88,64]][k][ch]:col[ch];result[i+3]=255}if(debug)return result;
for(const t of stamps){for(let dy=0;dy<32;dy++)for(let dx=0;dx<32;dx++){let x=(t.x+dx)%W,y=(t.y+dy)%H,i=(y*W+x)*4,k=kind(x,y,mode),sx=t.v*32+(t.flip?31-dx:dx),a=(dy*128+sx)*4;let edge=Math.min(dx,dy,31-dx,31-dy),r=Math.hypot((dx-15.5)/17,(dy-15.5)/17);if(edge<2||r> .83+(noise(x,y,48,32,t.seed%5)-.5)*.25)continue;let soil=[pixels[a],pixels[a+1],pixels[a+2]];for(let ch=0;ch<3;ch++)result[i+ch]=Math.round((soil[ch]*.70+[12,30,37][ch]*.30)/2)*2;
// Native RD foliage clusters; density follows an independent, periodic growth field.
let f=noise(x,y,12,8,81)*.65+noise(x,y,30,20,32)*.35;
let threshold=k===0?1:k===1?.64:.38;
if(f>threshold){let la=((dy+64)*128+sx)*4,R=pixels[la],G=pixels[la+1],B=pixels[la+2];if(G>R*1.35&&G>B*1.06){result[i]=R;result[i+1]=G;result[i+2]=B;}}
}}return result}

function draw(){let mode=document.getElementById('mode').value;g.putImageData(new ImageData(render(mode,document.getElementById('mask').checked),W,H),0,0);const rc=document.getElementById('repeat').getContext('2d');for(let yy=0;yy<2;yy++)for(let xx=0;xx<2;xx++)rc.drawImage(c,xx*W,yy*H);if(document.getElementById('grid').checked){g.strokeStyle='#e0dbb555';g.lineWidth=.5;for(let x=0;x<=W;x+=32){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<=H;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}}}window.ready=img.decode().then(()=>{const a=document.createElement('canvas');a.width=128;a.height=96;const ctx=a.getContext('2d');ctx.drawImage(img,0,0);pixels=ctx.getImageData(0,0,128,96).data;draw()});for(const id of ['mode','mask','grid'])document.getElementById(id).onchange=draw;window.FLOOR={render,kind,draw};
</script></html>
