<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>石の層 — パーツ配置・歩行検証</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202327;color:#e8dfcf;font:14px/1.7 system-ui}main{max-width:1120px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(320px,640px) 1fr;gap:28px}h1{font-size:22px;margin:0 0 12px}p{color:#bcb9ad;margin:10px 0}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#302d30;touch-action:none;border:1px solid #55544f}label{display:block;margin:8px 0;cursor:pointer}button{background:#42453e;color:#eee4cc;padding:7px 16px;border:1px solid #70715e;border-radius:4px;cursor:pointer}#parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.part{background:#313537;text-align:center;font-size:10px;padding:6px}.part img{width:64px;height:64px;image-rendering:pixelated;object-fit:contain}#status{color:#d2c698;min-height:25px}a{color:#c1d5dc}@media(max-width:760px){main{grid-template-columns:1fr;padding:12px}.part img{width:80px;height:80px}}
</style>
<main><section><canvas id="map" width="320" height="480" aria-label="石の層のパーツから組んだマップ"></canvas><p id="status">素材読み込み中…</p></section><aside><h1>石の層 / マップ試作</h1><p>岩棚で囲まれた通路から広間へ。実際のパーツ配置から描画しています。</p><p>クリック・タップで移動。WASD / 矢印キーでも歩けます。金色の点は歩行確認用です。</p><label><input id="objects" type="checkbox" checked>岩壁・石筍</label><label><input id="ground" type="checkbox" checked>床の石板・苔</label><label><input id="fog" type="checkbox" checked>奥の霞</label><label><input id="grid" type="checkbox">グリッドと通行判定</label><label><input id="actor" type="checkbox" checked>歩行マーカー</label><button id="reset">入口に戻る</button><p>20 × 30マス / 基準16px<br>上方の階段まで通行可能</p><a href="assets/stone-map-study-v1/map.json">配置データ</a> · <a href="assets/stone-map-study-v1/parts.json">パーツ定義</a><div id="parts"></div></aside></main>
<script src="assets/stone-map-study-v1/data.js"></script>
<script>
const {map:M,parts:P}=STONE_STUDY,cv=document.querySelector('canvas'),ctx=cv.getContext('2d'),images={},keys=new Set(),hero={...M.spawn},root='assets/stone-map-study-v1/';
ctx.imageSmoothingEnabled=false;let route=[],last=0;
const checked=id=>document.getElementById(id).checked;
const walk=(x,y)=>M.cells[Math.floor(y/16)]?.[Math.floor(x/16)]>0;
function pathTo(tx,ty){const start=[hero.x/16|0,hero.y/16|0],queue=[start],prev=new Map([[start.join(','),null]]);let end=null;for(let h=0;h<queue.length;h++){const [x,y]=queue[h];if(x===tx&&y===ty){end=[x,y];break;}for(const [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy,k=a+','+b;if(M.cells[b]?.[a]>0&&!prev.has(k)){prev.set(k,[x,y]);queue.push([a,b]);}}}if(!end)return[];const out=[];while(end){out.push({x:end[0]*16+8,y:end[1]*16+8});end=prev.get(end.join(','));}return out.reverse().slice(1);}
function sprite(o){const a=P.assets[o.id];ctx.drawImage(images[o.id],Math.round(o.x-a.anchor[0]),Math.round(o.y-a.anchor[1]));}
function draw(){ctx.clearRect(0,0,320,480);ctx.fillStyle='#302d30';ctx.fillRect(0,0,320,480);
 for(let y=0;y<M.height;y++)for(let x=0;x<M.width;x++)if((M.floorCells||M.cells)[y][x]>0){ctx.drawImage(images['floor-'+((x*13+y*7)%7<3?(x+y)%3+1:0)],x*16,y*16);}
 if(checked('ground'))M.ground.forEach(sprite);
 const items=checked('objects')?[...M.objects]:[];
 if(checked('actor'))items.push({id:'actor',x:hero.x,y:hero.y});items.sort((a,b)=>a.y-b.y);
 for(const o of items){if(o.id!=='actor')sprite(o);else{ctx.fillStyle='#574a36';ctx.fillRect(Math.round(o.x-4),Math.round(o.y),8,3);ctx.fillStyle='#eee0a7';ctx.fillRect(Math.round(o.x-2),Math.round(o.y-5),4,6);ctx.fillStyle='#b99141';ctx.fillRect(Math.round(o.x-3),Math.round(o.y-1),6,3);}}
 if(checked('fog')){for(let y=0;y<125;y+=3){const alpha=(1-y/125)*.2;ctx.fillStyle='rgba(90,126,142,'+alpha+')';ctx.fillRect(75,y,172,3);}}
 if(checked('grid')){for(let y=0;y<M.height;y++)for(let x=0;x<M.width;x++){ctx.fillStyle=M.cells[y][x]===0?'rgba(191,76,67,.24)':'rgba(97,165,120,.12)';ctx.fillRect(x*16,y*16,16,16);ctx.strokeStyle='rgba(240,234,203,.25)';ctx.strokeRect(x*16+.5,y*16+.5,16,16);}}
}
function tick(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;let dx=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0),dy=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);if(dx||dy)route=[];else if(route.length){dx=route[0].x-hero.x;dy=route[0].y-hero.y;if(Math.hypot(dx,dy)<2){hero.x=route[0].x;hero.y=route[0].y;route.shift();dx=dy=0;}}const len=Math.hypot(dx,dy);if(len){dx=dx/len*dt*42;dy=dy/len*dt*42;if(walk(hero.x+dx,hero.y))hero.x+=dx;if(walk(hero.x,hero.y+dy))hero.y+=dy;}draw();requestAnimationFrame(tick);}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){e.preventDefault();keys.add(e.key);}});window.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>keys.clear());
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*20),y=Math.floor((e.clientY-r.top)/r.height*30);route=pathTo(x,y);document.getElementById('status').textContent=route.length?'通路に沿って移動中':'そこには移動できません';});document.getElementById('reset').onclick=()=>{Object.assign(hero,M.spawn);route=[];};
Promise.all(Object.entries(P.assets).map(([id,a])=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{images[id]=im;ok()};im.onerror=no;im.src=root+a.file}))).then(()=>{for(const id of Object.keys(P.assets)){const el=document.createElement('div');el.className='part';el.innerHTML='<img src="'+root+P.assets[id].file+'" alt="'+id+'"><br>'+id;document.getElementById('parts').append(el);}document.getElementById('status').textContent='16種のパーツから構築 / 読み込み完了';window.STONE_PREVIEW={ready:true,hero,map:M,pathTo,draw,walk};requestAnimationFrame(tick);}).catch(()=>document.getElementById('status').textContent='素材の読み込みに失敗しました');
</script></html>
