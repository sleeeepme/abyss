<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洞窟の床・構図から作るタイル</title><style>*{box-sizing:border-box}body{margin:0;background:#101e25;color:#d8e5dc;font:15px/1.8 system-ui}main{max-width:1064px;margin:auto;padding:20px}h1{font-size:24px}h2{font-size:18px;margin-top:28px}p{color:#9fb6b2}canvas,img{image-rendering:pixelated;max-width:100%;height:auto;display:block}button,a{display:inline-block;background:#28484c;color:#def0e2;padding:8px 14px;margin:5px;border:1px solid #567377;font:inherit;cursor:pointer}nav{display:flex;flex-wrap:wrap}#map{width:768px}#repeat{width:1024px}#sheet{width:896px}</style><main><h1>陰影を整理したデフォルメ版</h1><p>苔の分布を維持し、細かな濃淡を7色に整理。影側の輪郭と葉の明るい面を強めています。</p><nav><button id="grid">タイル境界を表示</button><button id="shift">接続位置を中央へ</button></nav><canvas id="map" width="128" height="64"></canvas><h2>繰り返し確認</h2><canvas id="repeat" width="256" height="128"></canvas><h2>前稿との比較（左：前稿／右：デフォルメ版）</h2><img src="assets/stone-floor-v5/comparison.png" width="1024"><h2>切り出した32×32pxタイル</h2><img id="sheet" src="assets/stone-floor-v5/contact.png"><p>配置データに従って接続する構成です。任意の順に並べ替えるオートタイルではありません。</p><nav><a href="assets/stone-floor-v5/floor.png">床PNG</a><a href="assets/stone-floor-v5/tiles.png">タイルPNG</a><a href="assets/stone-floor-v5/map.tmj">Tiledマップ</a><a href="assets/stone-floor-v5/tileset.tsj">Tiledタイル定義</a></nav></main><script>
const atlas=new Image();atlas.src='assets/stone-floor-v5/tiles.png';let spec,grid=false,shift=false;const c=document.getElementById('map'),ctx=c.getContext('2d'),rep=document.getElementById('repeat'),r=rep.getContext('2d');function draw(){ctx.imageSmoothingEnabled=false;for(let y=0;y<2;y++)for(let x=0;x<4;x++){let id=spec.layers[0].data[y*4+x]-1;ctx.drawImage(atlas,id%4*32,(id/4|0)*32,32,32,x*32,y*32,32,32)}r.clearRect(0,0,256,128);for(let y=-1;y<3;y++)for(let x=-1;x<3;x++)r.drawImage(c,x*128+(shift?64:0),y*64+(shift?32:0));if(grid){ctx.strokeStyle='#c5d9a866';ctx.lineWidth=1;for(let x=0;x<128;x+=32){ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,64);ctx.stroke()}for(let y=0;y<64;y+=32){ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(128,y+.5);ctx.stroke()}}}window.ready=Promise.all([atlas.decode(),fetch('assets/stone-floor-v5/map.tmj').then(r=>r.json())]).then(([,m])=>{spec=m;draw()});document.getElementById('grid').onclick=()=>{grid=!grid;draw()};document.getElementById('shift').onclick=()=>{shift=!shift;draw()};
</script></html>
