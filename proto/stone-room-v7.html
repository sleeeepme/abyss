<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>床と苔・統一版</title><style>*{box-sizing:border-box}body{margin:0;background:#0b121d;color:#d8e6dd;font:15px/1.7 system-ui}main{max-width:1200px;margin:auto;padding:20px}h1{font-size:24px}h2{font-size:19px;margin-top:28px}p{color:#9db4b0}nav{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0;align-items:center}label,button,a{background:#1c3239;border:1px solid #3b595c;color:#d8e6dd;padding:7px 10px;font:inherit}canvas,img{image-rendering:pixelated}#map{display:block;width:832px;max-width:100%;height:auto}#parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}figure{margin:0;padding:12px;background:#1c3038;border:1px solid #2e484f;min-height:128px}figure img{width:auto;height:64px;max-width:100%;object-fit:contain}figcaption{font-size:12px;color:#a7bfb5}#status{min-height:24px;color:#91b3a8}a{display:inline-block}#help{max-width:750px}</style><main><h1>床と苔 — 壁なしの確認版</h1><p id="help">壁と床の孤立点を除去。追加の苔を元の床から切り出したパーツに置き換え、色と葉の形を統一しています。</p><nav><label><input id="grass" type="checkbox" checked>追加の苔</label><label><input id="objects" type="checkbox">キノコ・岩</label><label><input id="grid" type="checkbox">16pxグリッド</label><label><input id="collision" type="checkbox">通れない場所</label><button id="route">入口→出口の経路</button></nav><canvas id="map" width="416" height="352"></canvas><p id="status">床をクリックすると、その位置が歩けるか確認できます。</p><h2>追加・再整理したパーツ</h2><div id="parts"></div><h2>書き出し</h2><nav><a href="assets/stone-room-v7/room.png">部屋PNG</a><a href="assets/stone-room-v7/parts-preview.png">パーツ一覧PNG</a><a href="assets/stone-room-v7/room.tmj">Tiledマップ</a><a href="assets/stone-room-v7/stone-room-v7.zip">素材・配置データ一式ZIP</a></nav><p>床32片＋裸地3片＋同じ床から作った苔4種。キノコ・岩は比較用に保管し、必要なときだけ表示できます。壁パーツはこの版には含めていません。</p></main><script>
const root='assets/stone-room-v7/',c=document.getElementById('map'),g=c.getContext('2d');let data,images,showRoute=false;const on=id=>document.getElementById(id).checked;function part(o){if(o.layer==='grass'){g.save();g.beginPath();data.cells.forEach((v,i)=>{if(v)g.rect(i%data.width*16,(i/data.width|0)*16,16,16)});g.clip();g.drawImage(images[o.id],o.x,o.y);g.restore()}else g.drawImage(images[o.id],o.x,o.y)}function draw(){const T=data.tileSize;g.imageSmoothingEnabled=false;g.fillStyle=data.background;g.fillRect(0,0,c.width,c.height);data.ground.forEach((id,i)=>{if(id>=0)g.drawImage(images[id],i%data.width*T,(i/data.width|0)*T)});data.props.forEach(p=>{if(on(p.layer==='grass'?'grass':'objects'))part(p)});if(on('collision')){g.fillStyle='#eb84765a';activeCollision().forEach((v,i)=>{if(v)g.fillRect(i%data.width*T,(i/data.width|0)*T,T,T)})}if(on('grid')){g.strokeStyle='#92aea533';g.lineWidth=1;for(let x=0;x<c.width;x+=T){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,c.height);g.stroke()}for(let y=0;y<c.height;y+=T){g.beginPath();g.moveTo(0,y+.5);g.lineTo(c.width,y+.5);g.stroke()}}if(showRoute){g.fillStyle='#e2c67e';for(const i of route()){g.fillRect(i%data.width*T+6,(i/data.width|0)*T+6,4,4)}}}
function activeCollision(){return on('objects')?data.collision:data.cells.map(v=>v?0:1)}function route(){let W=data.width,H=data.height,start=data.spawn.y*W+data.spawn.x,end=data.exit.y*W+data.exit.x,queue=[start],prev=new Map([[start,null]]);while(queue.length){let i=queue.shift();if(i===end)break;let x=i%W,y=i/W|0;for(let [a,b] of [[x,y-1],[x+1,y],[x-1,y],[x,y+1]]){let j=b*W+a;if(a>=0&&a<W&&b>=0&&b<H&&!activeCollision()[j]&&!prev.has(j)){prev.set(j,i);queue.push(j)}}}let path=[];for(let i=end;i!==null&&prev.has(i);i=prev.get(i))path.push(i);return path}
window.ready=fetch(root+'data.json').then(r=>r.json()).then(async d=>{data=d;images=await Promise.all(d.parts.map(async p=>{let im=new Image();im.src=root+p.file;await im.decode();return im}));const names={'moss-unified-0':'苔・群落 A','moss-unified-1':'苔・群落 B','moss-unified-2':'苔・小群落','moss-unified-3':'苔・疎らな縁','bare-0':'裸地 A','bare-1':'裸地 B','bare-2':'裸地 C','front-0':'正面壁 A','front-1':'正面壁 B','end-left-0':'壁の左端','end-right-0':'壁の右端','side-left':'左の側壁','side-right':'右の側壁','rim-0':'壁の縁 A','rim-1':'壁の縁 B','moss-0':'草の密集','moss-2':'草の小群落','moss-3':'まばらな草','mushroom':'キノコ群','fern':'シダ','boulder':'岩'};d.parts.filter(p=>p.id>=32).forEach(p=>{const f=document.createElement('figure'),im=images[p.id].cloneNode(),cap=document.createElement('figcaption');cap.textContent=(names[p.name]||p.name)+' · '+p.w+'×'+p.h;f.append(im,cap);document.getElementById('parts').append(f)});draw()});for(const id of ['grass','objects','grid','collision'])document.getElementById(id).onchange=draw;document.getElementById('route').onclick=()=>{showRoute=!showRoute;draw()};c.onclick=e=>{const r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*c.width/r.width/16),y=Math.floor((e.clientY-r.top)*c.height/r.height/16);document.getElementById('status').textContent='セル ('+x+', '+y+')：'+(activeCollision()[y*data.width+x]?'壁・岩のため通行不可':'通行可能')};window.ROOM={route,draw};
</script></html>
