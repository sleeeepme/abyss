<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>床だけの比較 — 石の層</title><style>*{box-sizing:border-box}body{margin:0;background:#121c24;color:#d2ded9;font:14px/1.7 system-ui}main{max-width:1000px;margin:auto;padding:22px}h1{font-size:24px;margin:0}h2{font-size:18px;margin-top:28px}p{color:#96aeb2}img,canvas{image-rendering:pixelated}#map{width:960px;max-width:100%;height:auto;display:block}#sheet{width:768px;max-width:100%;height:auto}nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 0}button,a{background:#263944;color:#d9e4df;padding:8px;border:1px solid #516670;cursor:pointer}section{display:flex;gap:20px;flex-wrap:wrap}figure{margin:0}figure img{width:224px;height:160px}small{color:#9dadb0}</style><main><h1>石の層 — 床だけを確認</h1><p>16×16pxの地面4枚＋透過の表面変化4枚。壁・苔・照明を加えずに敷いています。</p><nav><label><input type="checkbox" id="detail" checked>表面の変化</label><label><input type="checkbox" id="grid">区切り線</label><button id="shuffle">配置を変える</button></nav><canvas id="map" width="320" height="192"></canvas><h2>同じドット倍率で比較</h2><section><figure><img src="assets/stone-floor-v1/reference-native.png"><figcaption>参照の床抜粋（推定原寸に縮小）</figcaption></figure><figure><canvas id="crop" width="28" height="20" style="width:224px;height:160px"></canvas><figcaption>今回の床から同じ大きさを抜粋</figcaption></figure></section><h2>8枚の素材</h2><img id="sheet" src="assets/stone-floor-v1/contact.png"><p>上段：地面4枚／下段：透過素材4枚を地面に重ねた表示。配置頻度は地面100%、追加素材は約33%。</p><nav><a href="assets/stone-floor-v1/base.png">地面PNG</a><a href="assets/stone-floor-v1/overlay.png">透過素材PNG</a><a href="assets/stone-floor-v1/tileset.tsj">Tiled定義</a></nav><small>素材はRetro Diffusion生成後に参照の床色へ減色し、接続端を統一しています。これは床の初稿確認用です。</small></main><script>
const c=document.getElementById('map'),g=c.getContext('2d'),crop=document.getElementById('crop').getContext('2d'),base=new Image(),over=new Image();g.imageSmoothingEnabled=false;crop.imageSmoothingEnabled=false;base.src='assets/stone-floor-v1/base.png';over.src='assets/stone-floor-v1/overlay.png';let seed=17;function hash(x,y){let n=Math.imul(x+seed,374761393)^Math.imul(y+19,668265263);n=Math.imul(n^(n>>>13),1274126177);return(n^(n>>>16))>>>0}function draw(){for(let y=0;y<12;y++)for(let x=0;x<20;x++){let h=hash(x,y),id=h%10<4?0:1+(h>>>5)%3;g.drawImage(base,id*16,0,16,16,x*16,y*16,16,16);if(document.getElementById('detail').checked&&(h>>>12)%3===0)g.drawImage(over,(h>>>18)%4*16,0,16,16,x*16,y*16,16,16)}crop.clearRect(0,0,28,20);crop.drawImage(c,104,74,28,20,0,0,28,20);if(document.getElementById('grid').checked){g.strokeStyle='#73929c66';g.lineWidth=.5;for(let x=0;x<=320;x+=16){g.beginPath();g.moveTo(x,0);g.lineTo(x,192);g.stroke()}for(let y=0;y<=192;y+=16){g.beginPath();g.moveTo(0,y);g.lineTo(320,y);g.stroke()}}}window.ready=Promise.all([base.decode(),over.decode()]).then(draw);document.getElementById('detail').onchange=document.getElementById('grid').onchange=draw;document.getElementById('shuffle').onclick=()=>{seed+=31;draw()};
</script></html>
