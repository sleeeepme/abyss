<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABYSS · 属性ヒットエフェクト</title><style>:root{color-scheme:dark;font-family:system-ui;background:#111917;color:#eaf0df}body{max-width:900px;margin:auto;padding:30px 20px}h1{font-size:26px;font-weight:500}p{font-size:13px;color:#aebca8;line-height:1.8}.controls{display:flex;gap:14px;align-items:center;margin:22px 0}button{padding:9px 15px;background:#293a2e;border:1px solid #51624c;color:#eef3e5;border-radius:5px}input{flex:1;accent-color:#d2dba8}main{display:grid;grid-template-columns:1fr 1fr;gap:15px}article{background:#18271e;border:1px solid #40513f;border-radius:6px;overflow:hidden}h2{font-size:16px;font-weight:500;padding:12px 15px;margin:0}canvas{display:block;width:100%;image-rendering:pixelated}.note{padding:0 15px;min-height:38px;font-size:12px}@media(max-width:650px){main{grid-template-columns:1fr}}</style></head><body><p>ABYSS / ELEMENT HIT STUDY</p><h1>色と形で、属性を読む。</h1><p>味方への被弾と敵への命中に同じ属性記号を表示。発生源ではなく、実際に与えたダメージ属性を示す。</p><div class="controls"><button id="play">一時停止</button><button id="replay">再生</button><input id="scrub" type="range" min="0" max="650" value="0"><span id="time">0 ms</span></div><main id="grid"></main><script src="ally-effect-study.js"></script><script src="element-hit-gallery.js"></script><script>
const fx=AllyEffectStudy,gallery=ElementHitGallery,$=id=>document.getElementById(id),notes={fire:'小さな火の粉だけが一瞬舞う',shock:'弱い2本の電撃が短く明滅',frost:'薄い霜煙が接触点から円形に広がる',arcane:'紫の魔素が火の粉のように浮く'};
for(const e of gallery.elements){const a=document.createElement('article');a.innerHTML=`<h2 style="color:${fx.elements[e].core}">${fx.elements[e].label}</h2><canvas width="320" height="170" id="${e}"></canvas><p class="note">${notes[e]}</p>`;$('grid').append(a);}
let age=0,playing=true,last=0;function draw(){for(const e of gallery.elements)gallery.scene($(e).getContext('2d'),e,age);$('scrub').value=Math.min(650,age*1000);$('time').textContent=Math.round(age*1000)+' ms';$('play').textContent=playing?'一時停止':'再開';}
$('play').onclick=()=>playing=!playing;$('replay').onclick=()=>{age=0;playing=true};$('scrub').oninput=()=>{age=Number($('scrub').value)/1000;playing=false;draw()};function frame(n){if(last&&playing)age=(age+Math.min(.05,(n-last)/1000))%.8;last=n;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
