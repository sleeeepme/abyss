<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アイテムアイコン</title>
<style>*{box-sizing:border-box}body{margin:0;background:#121820;color:#eee7d9;font:15px system-ui;padding:48px}main{max-width:1320px;margin:auto}h1{font-size:28px;margin:0 0 12px}p{color:#9aa8b5;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin:30px 0}.card{background:#202a34;border:1px solid #374553;border-radius:12px;text-align:center;padding:24px 12px}.art{height:160px;display:grid;place-items:center;background:repeating-conic-gradient(#242f3a 0% 25%,#293541 0% 50%) 0/16px 16px;border-radius:6px}img{image-rendering:pixelated}h2{font-size:16px;font-weight:500}.small{display:flex;align-items:center;justify-content:center;gap:20px;height:48px}.caption{font-size:12px;color:#9aa8b5}footer{border-top:1px solid #374553;padding-top:20px;color:#9aa8b5}@media(max-width:600px){body{padding:24px}.grid{grid-template-columns:repeat(2,1fr)}}</style>
<main><div class="caption">ABYSS / ITEM ART — 22</div><h1>アイテムアイコン</h1><p>指定フォルダの16 × 16 px透過PNG全20種を、そのまま実環境へ読み込んだ版。大きな表示はゲーム内密度、下段は指定PNGと実環境Canvasの一致確認。</p><div class="grid" id="grid"></div><footer>未鑑定品・専用アート未作成の装備は袋で表示。装備の輪郭はCommonの黒からLegendの金まで、6段階の色を本体輪郭上へ重ねます。</footer><div id="rarities" class="small" style="height:90px"></div></main>
<script src="item-icons-imported-data.js?v=20260915a"></script><script src="item-icons.js?v=20260915a"></script><script>
for(const [id,name] of [['sword','剣'],['great','大剣'],['dagger','短剣'],['spear','槍'],['mace','戦鎚（メイス）'],['axe','斧（手斧）'],['bow','弓'],['staff','杖'],['potion','回復薬'],['vial','試験管ポーション'],['leaf','葉'],['armor','鎧'],['chain','鎖帷子'],['plate','重鎧'],['robe','服'],['buckler','小盾'],['tower','大盾'],['ring','指輪'],['amulet','タリスマン']]){const url=ITEM_ART.sprites[id].toDataURL(),game=ITEM_ART.runtimeSprite({base:id,ident:true}).toDataURL();document.getElementById('grid').insertAdjacentHTML('beforeend',`<article class="card"><div class="art"><img src="${game}" width="144" height="144" alt="${name}"></div><h2>${name}</h2><div class="small"><img src="${url}" width="24" height="24" alt="指定PNG"><img src="${game}" width="24" height="24" alt="実環境Canvas"></div><p class="caption">指定PNG / 実環境</p></article>`)}
for(const col of ['#171323','#6cc24a','#5b8dd6','#a97fe0','#c4433f','#e8c95a']){const url=ITEM_ART.sprite({base:'sword',ident:true},col).toDataURL();document.getElementById('rarities').insertAdjacentHTML('beforeend',`<img src="${url}" width="72" height="72" alt="レアリティ別1ドット輪郭">`)}
const demo=document.createElement('canvas');demo.width=144;demo.height=72;demo.style.imageRendering='pixelated';document.getElementById('rarities').append(demo);
const dc=demo.getContext('2d');function pulse(t){dc.clearRect(0,0,144,72);ITEM_ART.draw(dc,{base:'sword',ident:true,rar:2},72,36,72,'#5b8dd6',matchMedia('(prefers-reduced-motion: reduce)').matches?1:.25+.75*(.5+.5*Math.cos(t/1800*Math.PI*2)));requestAnimationFrame(pulse)}requestAnimationFrame(pulse);
</script></html>
