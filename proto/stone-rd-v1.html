<!doctype html><html lang="ja"><meta charset="utf-8"><title>石の層 / Retro Diffusion</title><style>body{margin:28px;background:#242332;color:#d8dbd0;font:14px/1.6 system-ui}main{max-width:1150px;margin:auto}h1{font-size:24px}p{color:#acb8ac}img,canvas{image-rendering:pixelated;max-width:100%;height:auto}section{display:flex;gap:30px;flex-wrap:wrap;align-items:start}.checker{background:repeating-conic-gradient(#383443 0 25%,#45404e 0 50%) 0/24px 24px}button,a{background:#434553;color:#e6dec0;padding:9px;border:1px solid #747582;cursor:pointer}nav{display:flex;gap:15px;margin-bottom:20px}#objects{width:768px}#terrain{width:384px}#map{width:960px}small{color:#adb6ad}</style><main><h1>石の層 — Retro Diffusion タイルセット</h1><p>採掘洞窟の石床・崖・吊り橋。広い色面と暗紫の輪郭、32px地形／64px装飾。</p><nav><button id="grid">32pxグリッド切替</button><a href="assets/stone-rd-v1/props.png">透過パーツPNG</a><a href="assets/stone-rd-v1/terrain-nine.png">地形PNG</a></nav><h2>接続サンプル</h2><canvas id="map" width="384" height="288"></canvas><p>9分割地形の辺と中央を繰り返した矩形の足場。橋・階段は独立パーツ。ゲームの当たり判定は未接続です。</p><h2>地形チップ / 32×32</h2><img id="terrain" src="assets/stone-rd-v1/terrain-nine.png"><h2>崖・構造物・装飾 / 64×64</h2><img id="objects" class="checker" src="assets/stone-rd-v1/props.png"><p>前壁、端壁、内角壁／階段2方向、橋2方向／岩、石柱、瓦礫、坑口／灯具、巻き上げ機、木箱、蔦。</p><small>生成：Retro Diffusion RD Pro。画像の透明化・切り出し・整数倍書き出しのみローカル処理。</small></main><script>
const c=document.getElementById('map'),g=c.getContext('2d'),t=new Image(),o=new Image();g.imageSmoothingEnabled=false;let grid=false;t.src='assets/stone-rd-v1/terrain-nine.png';o.src='assets/stone-rd-v1/props.png';function platform(x,y,w,h){for(let j=0;j<h;j++)for(let i=0;i<w;i++){let sx=i===0?0:i===w-1?2:1,sy=j===0?0:j===h-1?2:1;g.drawImage(t,sx*32,sy*32,32,32,x+i*32,y+j*32,32,32)}}function prop(n,x,y,h=64){g.drawImage(o,n%4*64,(n>>2)*64,64,64,x,y,64,h)}function draw(){g.fillStyle='#242332';g.fillRect(0,0,c.width,c.height);platform(16,32,5,3);platform(224,96,4,4);platform(16,192,4,3);prop(7,162,96);prop(6,64,112,88);prop(11,80,9);prop(12,20,50);prop(8,253,101);prop(14,293,159);prop(13,35,201);if(grid){g.strokeStyle='#e1dbac55';for(let x=0;x<c.width;x+=32){g.beginPath();g.moveTo(x,0);g.lineTo(x,c.height);g.stroke()}for(let y=0;y<c.height;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(c.width,y);g.stroke()}}}window.ready=Promise.all([t.decode(),o.decode()]).then(draw);document.getElementById('grid').onclick=()=>{grid=!grid;draw()};
</script></html>
