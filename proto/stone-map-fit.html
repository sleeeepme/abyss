<main><section><canvas width="320" height="480" aria-label="本編生成マップへ石の層のパーツを適用"></canvas><div id="status">読み込み中…</div></section><aside><h1>既存マップでの画角検証</h1><p>本編のgenFloorから取得した同じ壁・床・階段データを、斜め上から描いた素材で表示。</p><label>マップ <select id="seed"></select></label><label>壁の描き方 <select id="mode"><option value="safe">通路を見せる（推奨）</option><option value="naive">背の高い岩をそのまま置く</option><option value="flat">元のグリッド構造</option></select></label><label><input type="checkbox" id="grid">通行判定を重ねる</label><label><input type="checkbox" id="marker" checked>歩行確認用マーカー</label><button id="entry">入口</button><button id="corridor">狭い通路・曲がり角</button><button id="tour">出口まで歩く</button><p>クリックで経路移動 / WASD・矢印で操作。2マス通路でも壁の見た目で道幅を変えない方式です。</p><p class="warn">「背の高い岩をそのまま置く」と比較すると、床へのはみ出しが分かります。マップの座標や当たり判定は切り替えても同じです。</p><p>本編のゲーム進行には未接続。マップ生成・戦闘バランスの変更なし。</p><a href="stone-map-study-v1.html">手配置のサンプル</a> · <a href="../output/stone-map-study-v1/parts-preview.png">パーツ一覧</a></aside></main>
