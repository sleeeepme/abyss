<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABYSS · 武器別エフェクト</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#111917;color:#e8ecdd}body{max-width:1200px;margin:auto;padding:30px 20px}h1{font-size:26px;font-weight:500}p{color:#adbaa6;line-height:1.8;font-size:13px}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:24px 0}button,select{padding:9px 16px;border:1px solid #526048;border-radius:5px;background:#28382b;color:#e9ecdf}main{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article{border:1px solid #43523d;border-radius:6px;overflow:hidden;background:#1b2a20}h2{font-size:17px;padding:14px 16px;margin:0;font-weight:500}canvas{width:100%;image-rendering:pixelated;display:block}article p{padding:0 16px;font-size:12px;min-height:38px}input{accent-color:#d2dba8}#scrub{flex:1;min-width:140px}a{color:#cfddbb}@media(max-width:850px){main{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){main{grid-template-columns:1fr}}</style></head><body>
<p>ABYSS / WEAPON EFFECTS</p><h1>武器ごとに、軌跡と手応えを。</h1><p>採用済みの6系統に、杖の魔弾を追加。<br>無属性・炎・雷・冷気・魔法で、軌跡・粒子・グローを色替え。</p>
<div class="controls"><button id="play">一時停止</button><button id="replay">全て再生</button><label>属性 <select id="element"><option value="neutral">無属性</option><option value="fire">炎</option><option value="shock">雷</option><option value="frost">冷気</option><option value="arcane">魔法</option></select></label><label>速度 <select id="speed"><option value="1">通常</option><option value=".5">半速</option></select></label><label><input type="checkbox" id="hit" checked>命中</label><label><input type="checkbox" id="elementHit" checked>属性ヒット</label><input type="range" min="0" max="700" value="0" id="scrub" aria-label="再生位置"><span id="time">0 ms</span></div><main id="grid"></main>
<p>キャラは既存の待機スプライトで大きさを比較しています。武器専用の攻撃ポーズは今回の試作に含みません。</p>
<script src="ally-effect-study.js"></script><script src="weapon-effect-gallery.js"></script><script>
const desc={greatsword:'採用済み · 太い刃と大きく弾ける粒子',hammer:'採用済み · 前へ尖る衝撃と放射状の破片',spear:'細長い刺突 · 穂先の奥へ抜ける光',bow:'飛翔する矢 · 軌跡と小さな着弾',swordaxe:'共通の片手斬撃 · 小さく鋭い弧',dagger:'採用済み · 素早い斬撃と短い余韻',magicbolt:'杖攻撃 · 光の塊が飛び、着弾でほどける'};
const gallery=WeaponEffectGallery,fx=AllyEffectStudy,$=id=>document.getElementById(id);
for(const key of gallery.keys){const card=document.createElement('article');card.innerHTML=`<h2>${fx.weapons[key].label}</h2><canvas width="320" height="170" id="${key}" aria-label="${fx.weapons[key].label}のエフェクト"></canvas><p>${desc[key]}</p>`;$('grid').append(card);}
let age=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
function draw(){for(const key of gallery.keys)gallery.scene($(key).getContext('2d'),key,age,{hit:$('hit').checked,element:$('element').value,elementHit:$('elementHit').checked});$('scrub').value=Math.min(700,age*1000);$('time').textContent=Math.round(Math.min(age,.7)*1000)+' ms';$('play').textContent=playing?'一時停止':'再開';}
$('play').onclick=()=>playing=!playing;$('replay').onclick=()=>{age=0;playing=true;};$('scrub').oninput=()=>{age=Number($('scrub').value)/1000;playing=false;draw();};
function frame(now){if(last&&playing)age=(age+Math.min(.05,(now-last)/1000)*Number($('speed').value))%1;last=now;draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
